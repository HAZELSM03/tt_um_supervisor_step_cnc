  # Entradas digitales
  ui[0]: "STEP_X"
  ui[1]: "STEP_Y"
  ui[2]: "VIGILAR"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Salidas digitales
  uo[0]: "FALLA"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Pines bidireccionales no utilizados
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Version del formato Tiny Tapeout
