
# Informacion del proyecto Tiny Tapeout

project:
  title: "Supervisor de pulsos STEP para CNC"
  author: "Oscar Hazel Guadalupe Serrano Membrila; Ramon Chavez Bracamontes"
  discord: ""
  description: "Supervisor digital de ausencia de pulsos STEP en ejes X y Y de un CNC"
  language: "Verilog"
  clock_hz: 10000000
  tiles: "1x1"
  top_module: "tt_um_supervisor_step_cnc"
  source_files:
    - "project.v"

# Asignacion de pines del circuito
